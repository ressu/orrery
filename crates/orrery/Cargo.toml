[package]
name = "orrery"
description = "Experimental Moonraker-compatible API server for Klipper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
orrery-build.workspace = true
orrery-proto.workspace = true
orrery-dbus.workspace = true
anyhow.workspace = true
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "query", "tokio", "ws"] }
clap = { workspace = true, features = ["env"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
form_urlencoded = "1"
futures-util.workspace = true
hmac = "0.13"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "qoi"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
percent-encoding = "2.3.2"
redb = "4"
regex.workspace = true
rustix = { workspace = true, features = ["fs", "param", "rand", "system", "termios", "time"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
tokio-util = { version = "0.7.20", features = ["io"] }
tokio.workspace = true
tracing-appender = "0.2.5"
tracing-subscriber.workspace = true
tracing.workspace = true
uuid = { version = "1.29.0", features = ["v4", "v5"] }
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "preserve_order", "serde"] }

[dev-dependencies]
tempfile.workspace = true
