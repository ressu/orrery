# Datastore spike: the same Moonraker-shaped workloads on redb and on SQLite.
# Standalone (its own workspace) so its dependencies stay out of the main build.
# See docs/design/2026-11-01-datastore-spike.md.
[package]
name = "datastore-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["redb", "sqlite"]
redb = ["dep:redb"]
sqlite = ["dep:rusqlite"]

[dependencies]
anyhow = "1"
redb = { version = "4", optional = true }
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
serde_json = "1"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
