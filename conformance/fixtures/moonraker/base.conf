# Base moonraker.conf for conformance runs. The runner fills in ${...} and appends each case's
# `config:` text. The data path (-d) supplies config/, logs/, gcodes/ and database/.
[server]
host: 127.0.0.1
port: ${port}
klippy_uds_address: ${klippy_socket}

[machine]
provider: none

[authorization]
# Local test clients are trusted unless a case configures authorization itself.
trusted_clients:
  127.0.0.0/8

[announcements]
# Never fetch remote feeds during tests.
enable_moonlight: False
