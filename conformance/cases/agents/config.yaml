name: an agent reads its own config section
targets: [orrery]
transports: [ws, unix]
klippy: none
config: |
  [test-agent]
  server: http://old.invalid
  timeout: 5

  [test-agent front]
  path: ~/front
files:
  config/orrery.toml: |
    [test-agent]
    server = "http://spoolman.invalid:7912"
    sync_rate = 5

    [test-agent.back]
    path = "~/back"
steps:
  - agent: {connect: {name: test-agent}}
  # orrery.toml's values keep their types and win; moonraker.conf's are text.
  - call: orrery.agent.config
    as_agent: true
    expect:
      section: test-agent
      exists: true
      options: {$exact: true, server: "http://spoolman.invalid:7912", timeout: "5", sync_rate: 5}
      # The options orrery.toml sets, for options an agent takes only from there.
      from_orrery_toml: [server, sync_rate]
      # Its named sections, from both files.
      named: [front, back]
  - call: orrery.agent.config
    as_agent: true
    params: {section: test-agent front}
    expect: {exists: true, options: {$exact: true, path: "~/front"}, from_orrery_toml: [], named: []}
  - call: orrery.agent.config
    as_agent: true
    params: {section: test-agent extra}
    expect: {exists: false, options: {}}
  - call: orrery.agent.config
    as_agent: true
    params: {section: server}
    expect_error: {code: 400, message: "Agent test-agent may not read the section [server]"}
