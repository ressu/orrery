name: a server in [spoolman] turns on the built-in Spoolman agent
description: >
  orrery only. With no [agent.spoolman] table, a [spoolman] server gives the agent Moonraker's
  names. command = false keeps orrery from starting orrery-spoolman, so the runner's test agent
  stands in for it.
targets: [orrery]
transports: [ws, http]
klippy: none
config: |
  [spoolman]
  server: http://spoolman.invalid:7912
files:
  config/orrery.toml: |
    [agent.spoolman]
    command = false
steps:
  - call: server.info
    expect: {components: {$contains: [spoolman]}, warnings: []}
  # Fluidd connects to Spoolman itself, at the server listed here.
  - call: server.config
    expect: {config: {spoolman: {$exact: true, server: "http://spoolman.invalid:7912", sync_rate: 5}}}
  - call: server.spoolman.get_spool_id
    http: {verb: GET, path: /server/spoolman/spool_id}
    expect_error: {code: 400, message: Agent spoolman not connected}
  - agent:
      connect:
        name: spoolman
        via: unix
        replies:
          get_spool_id: {result: {spool_id: 3}}
  - call: orrery.agent.register_endpoint
    as_agent: true
    params: {path: spool_id, request_methods: [GET, POST]}
    expect: ok
  - call: server.spoolman.get_spool_id
    http: {verb: GET, path: /server/spoolman/spool_id}
    expect: {spool_id: 3}
