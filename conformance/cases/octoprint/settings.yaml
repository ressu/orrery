name: OctoPrint's settings say there's no SD card
config: |
  [octoprint_compat]
transports: [http]
# Both report the UFP plugin. Moonraker reports a webcam too, and Orrery doesn't.
known_regression: octoprint-partial
steps:
  - call: octoprint.settings
    http: {verb: GET, path: /api/settings}
    expect:
      feature: {sdSupport: false, temperatureGraph: false}
      plugins: {UltimakerFormatPackage: $any}
      webcam: {webcamEnabled: true, streamUrl: /webcam/?action=stream}
