name: config webcams are listed and can't be changed through the API
config: |
  [webcam front]
  stream_url: /webcam/?action=stream
  snapshot_url: /webcam/?action=snapshot
  rotation: 90
steps:
  - call: server.webcams.list
    expect:
      webcams:
        - {$exact: true, name: front, enabled: true, icon: mdiWebcam, aspect_ratio: "4:3", target_fps: 15,
           target_fps_idle: 5, location: printer, service: mjpegstreamer, stream_url: /webcam/?action=stream,
           snapshot_url: /webcam/?action=snapshot, flip_horizontal: false, flip_vertical: false, rotation: 90,
           source: config, extra_data: {}, uid: $type:string}
    save: {uid: webcams.0.uid}
  - call: server.webcams.get_item
    params: {uid: "${uid}"}
    expect: {webcam: {name: front}}
  - call: server.webcams.post_item
    params: {name: front, stream_url: /other}
    expect_error: {code: 400, message: "Cannot overwrite webcam 'front' sourced from Moonraker configuration"}
  - call: server.webcams.delete_item
    params: {name: front}
    expect_error: {code: 400, message: "Cannot delete webcam 'front' sourced from Moonraker configuration"}
  - call: server.webcams.get_item
    params: {name: nope}
    expect_error: {message: "Webcam nope not found"}
  - call: server.webcams.get_item
    params: {uid: nope}
    expect_error: {message: "Webcam with UID nope not found"}
  - call: server.webcams.post_item
    params: {name: new}
    expect_error: {code: 400, message: "No data for argument: stream_url"}
  - call: server.webcams.post_item
    params: {name: new, stream_url: /s, rotation: 45}
    expect_error: {code: 400, message: "Invalid value for 'rotation': 45"}
  - call: server.webcams.post_item
    params: {name: new, stream_url: /s, aspect_ratio: wide}
    expect_error: {code: 400, message: "Invalid value for 'aspect_ratio': wide"}
