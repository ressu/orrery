name: server.logs.rollover starts a new server log
steps:
  - call: server.logs.rollover
    params: {application: moonraker}
    expect: {$exact: true, rolled_over: [moonraker], failed: {$exact: true}}
  # The new file is served at the same address.
  - download: moonraker.log
    expect_content_type: text/plain
  - call: server.logs.rollover
    params: {application: nothing}
    expect_error: {code: 400, message: Unknown application nothing}
    only: [http]
  # Klipper's log is rolled over by restarting its service; the suite has no services.
  - call: server.logs.rollover
    params: {application: klipper}
    expect: {rolled_over: [], failed: {$exact: true, klipper: "Unable to detect Klipper Service, cannot perform manual rollover"}}
