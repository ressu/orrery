name: users get their roles from orrery.toml, and a login only adds rights
targets: [orrery]
klippy: ready
transports: [http]
files:
  config/orrery.toml: |
    [authorization.networks]
    admin = ["127.0.0.0/8"]
    [authorization.keys]
    viewer = ["dash"]
    [authorization.users]
    operator = ["olive"]
steps:
  # The runner is admin by its network. Requests that send the viewer key are judged by the key
  # instead, so a login on top of it shows what the user's role adds.
  - call: orrery.access.key.get
    http: {verb: GET, path: /orrery/access/key/get, query: "name=dash"}
    save: {viewer: key}
  - call: access.post_user
    params: {username: olive, password: pw1}
    expect: {username: olive, action: user_created}
  - call: access.post_user
    params: {username: kid, password: pw1}
    expect: {username: kid, action: user_created}
  - call: access.post_user
    params: {username: dash, password: pw1}
    expect_error: {code: 400, message: "dash is the name of a key in orrery.toml's [authorization.keys], so a user can't have it"}
  - call: access.users.list
    expect: {users: [{username: olive, source: moonraker}, {username: kid, source: moonraker}, {username: dash, source: orrery}, {username: moonraker, source: orrery}]}
  # A failed login doesn't say which part was wrong.
  - call: access.login
    params: {username: olive, password: wrong}
    expect_error: {code: 401, message: Wrong user name or password}
  - call: access.login
    params: {username: nobody, password: pw1}
    expect_error: {code: 401, message: Wrong user name or password}
  - call: access.login
    params: {username: kid, password: pw1}
    expect_error: {code: 403, message: "orrery.toml doesn't give the user kid a role. An admin can add them under [authorization.users]."}
  - call: access.login
    params: {username: olive, password: pw1}
    save: {token: token}
  # The viewer key alone can't touch the history; with olive's login, the connection is an operator.
  - call: server.history.reset_totals
    http: {verb: POST, path: /server/history/reset_totals, headers: {X-Api-Key: "${viewer}"}}
    expect_error: {code: 403}
  - call: server.history.reset_totals
    http: {verb: POST, path: /server/history/reset_totals, headers: {X-Api-Key: "${viewer}", Authorization: "Bearer ${token}"}}
  - call: machine.reboot
    http: {verb: POST, path: /machine/reboot, headers: {X-Api-Key: "${viewer}", Authorization: "Bearer ${token}"}}
    expect_error: {code: 403, message: "Only an admin can reboot the printer's computer. This connection has the operator role, from its login, so it can print but can't change the printer's setup."}
  - call: access.get_user
    http: {verb: GET, path: /access/user, headers: {X-Api-Key: "${viewer}", Authorization: "Bearer ${token}"}}
    expect: {username: olive}
  # A new password ends the user's other sessions.
  - call: access.user.password
    http: {verb: POST, path: /access/user/password, body: {password: pw1, new_password: pw2}, headers: {Authorization: "Bearer ${token}"}}
    expect: {username: olive, action: user_password_reset}
  - call: access.get_user
    http: {verb: GET, path: /access/user, headers: {Authorization: "Bearer ${token}"}}
    expect_error: {code: 401}
  - call: access.login
    params: {username: olive, password: pw2}
    expect: {username: olive}
  - call: access.info
    expect: {available_sources: [moonraker], trusted: true}
