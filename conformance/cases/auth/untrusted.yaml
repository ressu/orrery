name: a client from an untrusted address can't use the API, but the unix socket can
klippy: none
transports: [ws, http, unix]
config: |
  [authorization]
  trusted_clients:
    10.0.0.0/8
steps:
  - call: access.info
    only: [ws, http]
    expect: {login_required: false, trusted: false}
  - call: server.info
    only: [ws]
    expect_error: {code: -32602, message: Unauthorized}
  - call: server.info
    only: [http]
    expect_error: {code: 401, message: Unauthorized}
  - call: server.info
    only: [unix]
    expect: {klippy_connected: false}
