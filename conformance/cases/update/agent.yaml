name: orrery starts the update manager agent, which answers Moonraker's update methods
description: >
  orrery only. orrery starts orrery-updater from its own folder, so `cargo build -p
  orrery-updater` must come first. The git entry points at a folder that isn't a repo, so no
  network is needed; the git refresh itself is in orrery-updater's unit tests. Fake Klippy
  reports /opt/klipper, which isn't a repo either, for Klipper's entry.
targets: [orrery]
transports: [ws]
klippy: ready
config: |
  [update_manager]
  refresh_interval: 24
  # The system entry would ask this machine's PackageKit for updates.
  enable_system_updates: False

  [update_manager missing]
  type: git_repo
  path: /nonexistent/orrery-updater-case
  origin: https://example.invalid/missing.git

  [update_manager tool]
  type: executable
  path: /nonexistent/orrery-updater-tool
  repo: example/tool
  channel: dev
  is_system_service: False

  [update_manager site]
  type: web
  repo: fluidd-core/fluidd
steps:
  # The agent connects after orrery starts.
  - call: machine.update.status
    retry_ms: 10000
    expect:
      busy: false
      github_rate_limit: null
      version_info:
        $exact: true
        # From printer.info, once Klippy is ready. Fake Klippy sends no app name, so it's Klipper.
        klipper:
          name: klipper
          configured_type: git_repo
          is_valid: false
          repo_detected: false
          warnings: [No git repo detected at configured path]
        missing:
          name: missing
          configured_type: git_repo
          is_valid: false
          repo_detected: false
          warnings: [No git repo detected at configured path]
        # orrery's own entry, an executable entry for orrery's folder. A development build
        # doesn't update itself, and the build folder has no release_info.json.
        orrery:
          name: orrery
          configured_type: archive
          channel: stable
          is_valid: false
          remote_version: "?"
          # The test build is for this machine's target, which orrery doesn't release for.
          warnings: {$contains: ["$regex:^orrery has no releases for this computer's CPU, ", "This is a development build, so orrery doesn't update itself."]}
        tool:
          name: tool
          configured_type: executable
          channel: stable
          channel_invalid: true
          is_valid: false
          owner: example
          repo_name: tool
          # Its folder is missing, and it has no install option: the update manager can't fix it.
          version: "?"
          remote_version: "?"
          warnings: ["Location at option 'path: /nonexistent/orrery-updater-tool' is not a directory.", Failed to validate installation]
  # An entry it can't use is a warning, and the others keep working.
  - call: server.info
    expect:
      components: {$contains: [update_manager]}
      warnings:
        - "[update_manager tool]: Invalid value 'dev' for option 'channel'. Type 'executable' supports the following channels: ['stable', 'beta'].  Falling back to channel 'stable'"
        - "[update_manager site]: orrery doesn't update web entries yet, so this entry is left out"
  - call: machine.update.refresh
    params: {name: site}
    expect_error: {code: 400, message: "No updater registered for 'site'"}
  - call: machine.update.klipper
    expect_error: {code: 400, message: "Update aborted, repo not valid: No git repo detected at configured path"}
  - expect_notification: notify_update_response
    match: [{application: klipper, complete: true, message: "Error updating klipper: Update aborted, repo not valid: No git repo detected at configured path"}]
  - call: machine.update.moonraker
    expect_error: {code: 400, message: "orrery doesn't update Moonraker."}
  # Updates, recovers, and rollbacks, with Moonraker's messages.
  - call: machine.update.client
    params: {name: site}
    expect_error: {code: -32601, message: "Updater site not available"}
  - call: machine.update.system
    expect_error: {code: -32601, message: "Updater system not available"}
  - call: machine.update.client
    params: {name: missing}
    expect_error: {code: 400, message: "Update aborted, repo not valid: No git repo detected at configured path"}
  - expect_notification: notify_update_response
    match: [{application: missing, complete: true, message: "Error updating missing: Update aborted, repo not valid: No git repo detected at configured path"}]
  # Klipper's entry comes first, and stops the update.
  - call: machine.update.full
    expect_error: {code: 400, message: "Update aborted, repo not valid: No git repo detected at configured path"}
  - expect_notification: notify_update_response
    match: [{application: full, complete: false, message: "Preparing full software update..."}]
  - expect_notification: notify_update_response
    match: [{application: full, complete: true, message: "Error updating klipper: Update aborted, repo not valid: No git repo detected at configured path"}]
  # The folder above the repo isn't there either, so the clone fails.
  - call: machine.update.recover
    params: {name: missing, hard: true}
    expect_error: {code: 500, message: "$regex:^Git Clone Error: "}
  - expect_notification: notify_update_response
    match: [{application: recover_missing, complete: false, message: "Git Repo missing: Attempting Repo Recovery..."}]
  - call: machine.update.rollback
    params: {name: missing}
    expect_error: {code: 400, message: "Incomplete rollback data stored, cannot rollback"}
  - call: machine.update.recover
    params: {name: tool}
    expect_error: {code: 400, message: "Updater tool is not a Git Repo Type"}
  - call: machine.update.client
    params: {name: tool}
    expect_error: {code: 400, message: "Executable tool: Invalid install detected, aborting update"}
  - call: machine.update.recover
    expect_error: {code: 400, message: "No data for argument: name"}
  # orrery's own entry, by name: a development build doesn't update itself, or roll back. A
  # full update skips it.
  - call: machine.update.client
    params: {name: orrery}
    expect_error: {code: 400, message: "This is a development build, so orrery doesn't update itself."}
  - call: machine.update.rollback
    params: {name: orrery}
    expect_error: {code: 400, message: "This is a development build, so orrery doesn't update itself."}
  - call: machine.update.recover
    params: {name: orrery}
    expect_error: {code: 400, message: "Updater orrery is not a Git Repo Type"}
  # The check is saved in the agent's namespace.
  - call: server.database.get_item
    params: {namespace: update_manager, key: missing}
    expect: {value: {config_hash: "$regex:^[0-9a-f]{16}$", status: {is_valid: false}}}
  # No checks while a print runs.
  - klippy: {update: {print_stats: {state: printing}}}
  - call: machine.update.refresh
    retry_ms: 2000
    expect_error: {code: 503, message: "Server is busy, cannot perform refresh"}
  - call: machine.update.client
    params: {name: missing}
    expect_error: {code: 503, message: "Update Refused: Klippy is printing"}
  - call: machine.update.full
    expect_error: {code: 503, message: "Update Refused: Klippy is printing"}
  - call: machine.update.recover
    params: {name: missing}
    expect_error: {code: 400, message: "Recovery Attempt Refused: Klippy is printing"}
  - call: machine.update.rollback
    params: {name: missing}
    expect_error: {code: 400, message: "Rollback Attempt Refused: Klippy is printing"}
  - klippy: {update: {print_stats: {state: standby}}}
  - call: machine.update.refresh
    retry_ms: 2000
    expect: {busy: false, version_info: {missing: {is_valid: false}}}
  - expect_notification: notify_update_refreshed
    match: [{busy: false}]
